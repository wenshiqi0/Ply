[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
ply-core = { path = "crates/ply-core" }
ply-storage = { path = "crates/ply-storage" }
ply-io = { path = "crates/ply-io" }
ply-jsc = { path = "crates/ply-jsc" }
ply-kernel = { path = "crates/ply-kernel" }
ply-libc = { path = "crates/ply-libc" }
ply-sh = { path = "crates/ply-sh" }

anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
pulldown-cmark = { version = "=0.13.4", default-features = false }
oxc = { version = "0.155", features = ["transformer", "codegen", "semantic", "ast_visit"] }
oxc_ecmascript = "0.155"
regex = "1"
url = "2.5.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "gzip", "brotli", "deflate"] }
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "=0.10.0"
tempfile = "3"
thiserror = "2"
unicode-width = "0.2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[profile.release]
lto = "thin"
