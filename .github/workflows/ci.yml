name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install JavaScriptCoreGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libjavascriptcoregtk-4.1-dev

      # The Node version Ply aligns with (RFC 0014); compat expectations
      # are re-recorded with it.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run compat:check

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Fixture models and local HTTP only: no provider calls or keys.
      - run: cargo test --workspace --locked
